function abrirVentana(URL,barras) {
	var atributos="resizable=no"

	case 0:estado=estado+"='hidden'";break
	case 1:estado=estado+"='visible'";break
	case 2:estado=estado+"='inherit'"};
	eval(estado);
	}
}
