var ventana, ayuda // Variables globales NO BORRAR

function ajustarVentana()	{
	var alto =Layer1.style.height;
	var ancho =Layer1.style.width;
	var a=ancho.indexOf('px');
	var b=alto.indexOf('px');
	var x =20+eval(ancho.slice(0,a));
	var y =40+eval(alto.slice(0,b));
	if (y>400){x=x+20;y=400};
	moveTo(20,20);resizeTo(x,y)
	}

function abrirVentana(URL,barras) {
	var atributos="status=no,resizable=yes,width=50,height=50";
	if(ventana) ventana.close();
	if (barras) atributos=atributos+',scrollbars=yes'
	ventana=window.open(URL,"",atributos)
}

function abrirAyuda(numero,apartado) {
	var atributos="status=no,scrollbars=yes,resizable=yes,width=50,height=50";
	if(ayuda)ayuda.close();
	if(!apartado) apartado=0;
	var URL='../../../ayuda'+ numero+ '/1.htm#'+apartado;
	if(apartado>=0)ayuda=window.open(URL,"",atributos)
}

function cerrarVentanas() {
	if(ventana) ventana.close();
	if(ayuda) ayuda.close();
}

function mostrarObjetos(){
	for (var i=1 ; i <arguments.length; i =i+ 2){
	var estado=arguments[0]+arguments[i]+".style.visibility";
	switch(arguments[i+1]){
	case 0:estado=estado+"='hidden'";break
	case 1:estado=estado+"='visible'";break
	case 2:estado=estado+"='inherit'"};
	eval(estado)
	}
}

function verHasta(n) {
	var totalCeldas =tabla.cells.length,i;
	if (n>totalCeldas-1){n=totalCeldas-1};
	for (i=3 ; i <n+1; i++){
		mostrarObjetos("celda",i,1)
	}
	for (i=n+1; i <totalCeldas; i++){
		mostrarObjetos("celda",i,0)
	}
}

function siguiente(celda) {
	var n = eval(celda.slice(5))+1;
	if(eval("celda"+ n +".style.visibility")=="hidden")
	{verHasta(n+1)}else {verHasta(n-1)};
}

function ultimaVisible() {
	var totalCeldas =tabla.cells.length,i; 
	for (i=3 ; i < totalCeldas; i=i+2){
		if(eval("celda"+ i +".style.visibility")=="hidden"){return(i-2);break}
		}
	return(totalCeldas-1)
}
	
function apartado() {
	var n=ultimaVisible();
	switch (n){
		case 1: return(4);break;
		case 3: return(3);break;
		case 5: return(2);break;
	default: return (-1)
	}
}
