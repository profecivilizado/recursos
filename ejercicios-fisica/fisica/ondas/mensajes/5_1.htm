    <td width="396"><p class="mimimo">Considera una onda de fase: &omega;t - kx</p>
      <p>Calculamos la fase espacio-temporal en (x<sub>1</sub>, t<sub>1</sub>) 
        y (x<sub>2</sub>, t<sub>2</sub>)</p>
      <p class="m50"><img src="formulas/4_01.gif" width="120" height="52" /></p>
      <p class="mimimo">Igualando las fases:</p>
      <p class="mimimo"><img src="formulas/4_02.gif" width="374" height="22" /></p>
      <p>Si t<sub>2</sub> &gt; t<sub>1</sub> el segundo miembro ser&aacute; positivo 
        y por tanto el primer miembro tendr&aacute; que ser positivo tambi&eacute;n 
        lo que implica x<sub>2</sub> &gt; x<sub>1</sub></p>
      <p>La onda se propaga en sentido de x creciente</p>
