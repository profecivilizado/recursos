function mostrarObjetos(){
	for (var i=1 ; i <arguments.length; i =i+ 2){
	var estado=arguments[0]+arguments[i]+".style.visibility";
	switch(arguments[i+1]){
	case 0:estado=estado+"='hidden'";break
	case 1:estado=estado+"='visible'";break
	case 2:estado=estado+"='inherit'"};
	eval(estado)
	}
}

function verHasta(n) {
	var totalCeldas =tabla.cells.length,i;
	if (n>totalCeldas-1){n=totalCeldas-1};
	for (i=3 ; i <n+1; i++){
		mostrarObjetos("celda",i,1)
	}
	for (i=n+1; i <totalCeldas; i++){
		mostrarObjetos("celda",i,0)
	}
}

function siguiente(celda) {
	var n = eval(celda.slice(5))+1;
	if(eval("celda"+ n +".style.visibility")=="hidden")
	{verHasta(n+1)}else {verHasta(n-1)};
}
