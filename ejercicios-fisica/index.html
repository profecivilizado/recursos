<style>
:root{--paper:#f3f6fa;--panel:#fff;--ink:#15203a;--muted:#5a6479;--line:#d6dde8;--accent:#1f55d6;--hover:#eef3fb;--sel:#e3ebfb;--red:#c2410c;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;--f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0e1420;--panel:#121826;--ink:#e7ecf5;--muted:#9aa5ba;--line:#28344a;--accent:#8fb2ff;--hover:#1b2436;--sel:#1f2c48;--red:#ff9a6b;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1420;--panel:#121826;--ink:#e7ecf5;--muted:#9aa5ba;--line:#28344a;--accent:#8fb2ff;--hover:#1b2436;--sel:#1f2c48;--red:#ff9a6b;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);padding:24px max(16px,env(safe-area-inset-left,0px)) 56px}
.embed body{padding-top:4px}
.embed .top{display:none}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between}
.top .eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font:800 clamp(28px,4.4vw,42px)/1.05 var(--f-display);letter-spacing:-.02em;margin:6px 0 4px}
.top p{margin:0;color:var(--muted);max-width:70ch}
.top .tools{display:flex;gap:8px;align-items:center}
a.back{color:var(--accent);text-decoration:none;font-size:14px}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;line-height:1.2}
button:hover{background:var(--hover)}
button:disabled{opacity:.4;cursor:default}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{font:700 15px var(--f-display);padding:9px 16px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
nav.side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:900px){nav.side{position:static;max-height:none}}
nav.side details.mob>summary{display:none}
@media (max-width:900px){nav.side details.mob>summary{display:flex;justify-content:space-between;cursor:pointer;font:700 15px var(--f-display);padding:6px 8px;list-style:none}nav.side details.mob>summary::-webkit-details-marker{display:none}nav.side details.mob>summary::after{content:"+";color:var(--muted)}nav.side details.mob[open]>summary::after{content:"−"}}
.blk{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px}
details.tema>summary{list-style:none;cursor:pointer;padding:8px 10px;border-radius:10px;font:700 15px/1.3 var(--f-display);display:flex;justify-content:space-between;gap:8px}
details.tema>summary::-webkit-details-marker{display:none}
details.tema>summary::after{content:"›";color:var(--muted);transition:transform .15s}
details.tema[open]>summary::after{transform:rotate(90deg)}
details.tema>summary:hover{background:var(--hover)}
.grp{font-size:12px;color:var(--red);font-weight:700;padding:8px 12px 2px 18px}
.it{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:transparent;padding:6px 10px 6px 18px;font-size:14.5px;color:var(--ink)}
.it:hover{background:var(--hover)}
.it.on{background:var(--sel);color:var(--accent);font-weight:700}
main{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.bar .ttl{flex:1 1 200px;min-width:0;font:700 15px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .crumb{display:block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#help{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.view{padding:14px 16px 18px}
#main{display:block;width:100%;border:0;height:600px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);border-radius:16px;width:min(900px,100%);max-height:calc(100vh - 32px);display:grid;grid-template-rows:auto 1fr;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font:700 15px var(--f-display)}
.sheet .body{overflow:auto;padding:12px 16px}
.sheet iframe{display:block;width:100%;border:0;height:400px}
.note{font-size:13px;color:var(--muted);margin:0}
</style>
